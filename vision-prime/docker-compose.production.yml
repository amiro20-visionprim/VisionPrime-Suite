services:
  # --- PostgreSQL 17 ---
  postgres:
    image: postgres:17-alpine
    container_name: vision-prime-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-vision_prime}
      POSTGRES_USER: ${DB_USERNAME:-vision_prime}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-vision_prime} -d ${DB_DATABASE:-vision_prime}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vision-prime-internal
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # --- Redis 8 ---
  redis:
    image: redis:8-alpine
    container_name: vision-prime-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - vision-prime-internal
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # --- Laravel App (PHP-FPM) ---
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    container_name: vision-prime-app
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-vision_prime}
      DB_USERNAME: ${DB_USERNAME:-vision_prime}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      SESSION_ENCRYPT: "true"
      SESSION_SECURE_COOKIE: "true"
      SESSION_SAME_SITE: "lax"
      REDIS_CLIENT: phpredis
      LOG_CHANNEL: stderr
      LOG_LEVEL: error
    volumes:
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vision-prime-internal
      - vision-prime-frontend
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # --- Laravel Horizon (Queue Workers) ---
  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    container_name: vision-prime-horizon
    restart: unless-stopped
    command: php artisan horizon
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-vision_prime}
      DB_USERNAME: ${DB_USERNAME:-vision_prime}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      HORIZON_PREFIX: ${APP_NAME:-vision-prime}
    volumes:
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vision-prime-internal
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # --- Nginx (Reverse Proxy + Static Files + SSL) ---
  nginx:
    image: nginx:alpine
    container_name: vision-prime-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./public:/var/www/html/public:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - app
    networks:
      - vision-prime-frontend
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # --- Scheduler (Cron) ---
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    container_name: vision-prime-scheduler
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-vision_prime}
      DB_USERNAME: ${DB_USERNAME:-vision_prime}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: 6379
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vision-prime-internal
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_storage:
    driver: local
  app_bootstrap_cache:
    driver: local
  nginx_cache:
    driver: local

networks:
  vision-prime-internal:
    driver: bridge
    internal: true
  vision-prime-frontend:
    driver: bridge